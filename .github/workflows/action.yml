name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle & Run Tests
        run: ./gradlew build jacocoTestReport

      - name: Coverage summary
        if: always()
        run: |
          XML=$(find build/reports -name 'jacocoTestReport.xml' | head -1)
          if [ -z "$XML" ]; then
            echo "No JaCoCo XML report found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The last <counter> of each type in the file is the report-wide total.
          row() {
            line=$(grep -o "<counter type=\"$1\"[^>]*/>" "$XML" | tail -1)
            missed=$(echo "$line" | sed -E 's/.*missed="([0-9]+)".*/\1/')
            covered=$(echo "$line" | sed -E 's/.*covered="([0-9]+)".*/\1/')
            awk -v n="$2" -v m="$missed" -v c="$covered" 'BEGIN { printf "| %s | %.1f%% | %d / %d |\n", n, 100*c/(m+c), c, m+c }'
          }

          {
            echo "### Test coverage (JaCoCo)"
            echo
            echo "| Metric | Covered | Covered / total |"
            echo "|---|---|---|"
            row INSTRUCTION "Instructions (build gate, min. 70%)"
            row LINE "Lines"
            row BRANCH "Branches"
            echo
            echo "_Packages excluded from the report: report, groupUser, geocoding, weather, trip DTOs._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe # v4
        if: always()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'

      - name: Upload All Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-test-and-coverage-reports
          path: build/reports/

  security-scan:
    name: Security Vulnerability Scan (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # HIGH: report only (does not fail the build)
      - name: Trivy FS scan - report HIGH and CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      # CRITICAL: fail the build
      - name: Trivy FS scan - fail on CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'

  build-and-push-docker:
    name: Build, Scan & Push Docker Image to GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [ build-and-test, security-scan ]
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Same value as the type=sha,format=short tag produced by docker/metadata-action below.
      - name: Compute immutable image tag
        id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build Docker image (local, for scanning)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: planner-scan:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # HIGH: report only (does not fail the build)
      - name: Trivy image scan - report HIGH and CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: planner-scan:ci
          ignore-unfixed: true
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      # CRITICAL: fail before anything is pushed to GHCR
      - name: Trivy image scan - fail on CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: planner-scan:ci
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'

      - name: Push Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy-vps:
    name: Deploy to VPS
    needs: build-and-push-docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.build-and-push-docker.outputs.tag }}
    secrets: inherit
