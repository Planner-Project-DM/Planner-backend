name: Deploy

# Used in two ways:
#  - called from action.yml after the image is pushed (push to main),
#  - run manually (Actions -> Deploy -> Run workflow) to redeploy or roll back to any image tag, e.g. sha-abc1234.
on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (e.g. sha-abc1234)'
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Validate tag and prepare variables
        id: vars
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^[A-Za-z0-9_.-]{1,128}$ ]]; then
            echo "Invalid image tag: $TAG" >&2
            exit 1
          fi
          echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH (with health check and automatic rollback)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          IMAGE_TAG: ${{ inputs.tag }}
          IMAGE_REPO: ghcr.io/${{ steps.vars.outputs.repo }}
          REPO_URL: https://github.com/${{ github.repository }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: IMAGE_TAG,IMAGE_REPO,REPO_URL,GHCR_USER,GHCR_TOKEN
          # Do NOT enable script_stop: it injects an exit-code check after every script line,
          # which breaks multi-line constructs (case/for/if). The script stops on errors by itself (set -euo pipefail).
          command_timeout: 8m
          script: |
            set -euo pipefail

            SERVICE=dysky_planner_backend
            cd /srv/shared/planner

            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            wait_healthy() {
              for _ in $(seq 1 36); do
                status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$SERVICE" 2>/dev/null || echo missing)
                echo "health: $status"
                case "$status" in
                  healthy) return 0 ;;
                  unhealthy|none|missing) return 1 ;;
                esac
                sleep 5
              done
              return 1
            }

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Remember the image that is running now, so we can go back to exactly that image.
            PREV_ID=$(docker inspect --format '{{.Image}}' "$SERVICE" 2>/dev/null || true)
            if [ -n "$PREV_ID" ]; then
              docker tag "$PREV_ID" "$IMAGE_REPO:rollback"
              echo "Previous image: $PREV_ID"
            else
              echo "No running container found - rollback will not be possible."
            fi

            export IMAGE_TAG
            echo "Deploying $IMAGE_REPO:$IMAGE_TAG"

            # If the pull fails (e.g. the tag does not exist) nothing has been touched yet and the script stops here.
            docker compose pull "$SERVICE"
            docker compose up -d --no-deps "$SERVICE"

            if wait_healthy; then
              echo "Deploy OK: $IMAGE_TAG is healthy."

              touch .env
              sed -i '/^IMAGE_TAG=/d' .env
              echo "IMAGE_TAG=$IMAGE_TAG" >> .env
              echo "Pinned IMAGE_TAG=$IMAGE_TAG in $(pwd)/.env"
            else
              echo "Deploy FAILED: $IMAGE_TAG is not healthy. Last container logs:"
              docker logs --tail 80 "$SERVICE" || true

              if [ -n "$PREV_ID" ]; then
                echo "Rolling back to $PREV_ID"
                IMAGE_TAG=rollback docker compose up -d --no-deps "$SERVICE"
                if wait_healthy; then
                  echo "Rollback OK."
                else
                  echo "Rollback container is NOT healthy either - manual intervention needed."
                fi
              fi
              exit 1
            fi

            # Remove only unused images of this repository older than 7 days (labels set by docker/metadata-action).
            docker image prune -a -f --filter "until=168h" --filter "label=org.opencontainers.image.source=$REPO_URL" || true
            docker image prune -f || true
